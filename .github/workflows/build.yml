    name: Build
    
    on:
      push:
      pull_request:
        branches: [main]

    jobs:
      build:
        runs-on: ubuntu-latest

        steps:
          # Checkout repository
          - uses: actions/checkout@v3

          # Install .NET SDK
          - name: Set up .NET
            uses: actions/setup-dotnet@v3
            with:
              dotnet-version: 9.0.x

          # Restore NuGet packages
          - name: Restore
            run: dotnet restore

          # Build solution
          - name: Build
            run: dotnet build --no-restore --configuration Release 


                
